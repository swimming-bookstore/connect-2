[package]
name = "connect2-agent"
version = "0.1.0"
edition = "2021"
description = "Connect 2 on Teleport: reverse-tunnel node with Chromium, shell, and coding agent"
license = "MIT"
default-run = "connect2-agent"

[lib]
name = "connect2"

[features]
default = ["web", "desktop"]
web = []
desktop = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
connect2-teleport = { path = "crates/connect2-teleport" }
futures-util = "0.3"
hostname = "0.4"
libc = "0.2"
open = "5"
provider-grok = { git = "https://github.com/swimming-bookstore/fun-coding-agent", branch = "master" }
nix = { version = "0.29", features = ["term", "process", "fs", "signal", "dir"] }
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
russh = { path = "vendor/russh/russh", default-features = false, features = ["flate2", "ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "io-std", "process", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "0.11"
webrtc-util = "0.9"
webpki-roots = "0.26"
turn = "0.8"

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.100"
