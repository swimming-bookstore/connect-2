[package]
name = "connect2-teleport"
version = "0.1.0"
edition = "2021"
description = "Teleport join, reverse tunnel, inventory, and connect-app sessions (no tsh)"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
hostname = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "fs"] }
rand = "0.8"
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
russh = { path = "../../vendor/russh/russh", default-features = false, features = ["flate2", "ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "process", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
